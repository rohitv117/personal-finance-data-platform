fndataops:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_USER', 'finops_user') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: finops
      schema: public
      threads: 4
      keepalives_idle: 0
      search_path: public
    prod:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      user: "{{ env_var('DBT_USER', 'finops_user') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      dbname: finops
      schema: public
      threads: 8
      keepalives_idle: 0
      search_path: public 