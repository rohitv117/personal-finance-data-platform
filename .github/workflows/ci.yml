name: Personal Finance Data Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: fndataops

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: fndataops/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m compileall -q api ingest orchestration dq observability security
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics
      - run: mypy ingest/scripts/ --ignore-missing-imports
      - run: pytest tests/ --cov=ingest/scripts --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: fndataops/coverage.xml

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DBT_USER: postgres
      DBT_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finops
      DBT_PROFILES_DIR: ${{ github.workspace }}/fndataops/dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: fndataops/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python ci/load_fixture.py
      - run: dbt deps --project-dir dbt
      - run: dbt build --project-dir dbt
      - run: dbt docs generate --project-dir dbt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: fndataops/dbt/target/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit==1.7.5 pbr==6.1.1
      - run: bandit -r ingest api orchestration dq observability security ci -ll -f json -o bandit-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: fndataops/bandit-report.json
